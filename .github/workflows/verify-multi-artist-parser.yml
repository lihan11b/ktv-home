name: Verify multi-artist parser

on:
  push:
    branches:
      - custom/mkv-filename-metadata
    paths:
      - ".github/workflows/verify-multi-artist-parser.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: ./mvnw --batch-mode test
