name: Build ChickenRice Translate CPU

on:
  push:
    branches:
      - chickenrice/translate-cpu-image
    paths:
      - "chickenrice-docker/**"
      - ".github/workflows/build-chickenrice-translate-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: ./chickenrice-docker
          file: ./chickenrice-docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/lihan11b/chickenrice-translate-cpu:62104884-cpu-v1
            ghcr.io/lihan11b/chickenrice-translate-cpu:latest
            ghcr.io/lihan11b/chickenrice-translate-cpu:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
