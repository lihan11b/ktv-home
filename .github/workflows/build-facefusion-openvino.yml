name: Build FaceFusion OpenVINO

on:
  workflow_dispatch:
  push:
    branches:
      - facefusion/openvino-image
    paths:
      - "facefusion-openvino/**"
      - ".github/workflows/build-facefusion-openvino.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./facefusion-openvino
          file: ./facefusion-openvino/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/lihan11b/facefusion-openvino:3.9.1-ov2025.4.1
            ghcr.io/lihan11b/facefusion-openvino:latest
          labels: |
            org.opencontainers.image.title=FaceFusion OpenVINO for ZSpace
            org.opencontainers.image.source=https://github.com/lihan11b/ktv-home
            org.opencontainers.image.version=3.9.1-ov2025.4.1
          provenance: false
