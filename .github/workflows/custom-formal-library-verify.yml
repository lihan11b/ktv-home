name: Verify formal library scan

on:
  push:
    branches:
      - custom/mkv-filename-metadata
    paths:
      - ".github/workflows/custom-formal-library-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: ./mvnw --batch-mode test

  h5:
    name: H5 tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: h5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: h5/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run H5 tests
        run: npm test
      - name: Build H5
        run: npm run build
